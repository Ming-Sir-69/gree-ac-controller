services:
  gree-ac-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gree-ac-controller
    restart: unless-stopped
    env_file:
      - .env                          # 敏感凭证：CLIENT_ID / CLIENT_SECRET / DEVICE_ID / REMOTE_ID
    environment:

      # ═══════════════════════════════════════
      # 系统
      # ═══════════════════════════════════════
      - TZ=Asia/Shanghai
      - BASE_URL=https://openapi.tuyacn.com

      # ═══════════════════════════════════════
      # 日志级别（INFO=常规 / DEBUG=含完整API响应）
      # 排查问题时改为 DEBUG，平时保持 INFO 减少磁盘写入
      # ═══════════════════════════════════════
      - LOG_LEVEL=INFO

      # ═══════════════════════════════════════
      # 调温首选触发窗口（睡眠/普通/预冷/饭后）
      # 格式：MM:SS，MM 自动取 %5
      # 例：00:30 → 每5分钟的 X0:30 附近触发
      # ═══════════════════════════════════════
      - TRIGGER_TIME=00:30

      # ═══════════════════════════════════════
      # 触发窗口容差（秒）
      # TRIGGER_TIME ±TRIGGER_WINDOW 秒内均视为命中
      # 默认 2 秒，网络波动大时可调大到 3–5
      # ═══════════════════════════════════════
      - TRIGGER_WINDOW=2

      # ═══════════════════════════════════════
      # 兜底倍率
      # 超过 间隔 × FALLBACK_RATIO 秒仍未触发则强制补发
      # 默认 1.3（即调温 390s、关机按各自间隔×1.3）
      # ═══════════════════════════════════════
      - FALLBACK_RATIO=1.3

      # ═══════════════════════════════════════
      # 关机检查间隔（仅关机检查模式，单位分钟）
      # 范围 1–120，默认 30
      # ═══════════════════════════════════════
      - OFF_CHECK_INTERVAL=30

      # ───────────────────────────────────────
      # 预冷档  时段：09:50–10:00 / 11:50–12:00 / 15:20–15:30
      # ───────────────────────────────────────
      - PRECOOL_TEMP=20
      - PRECOOL_MODE=制冷
      - PRECOOL_WIND=中

      # ───────────────────────────────────────
      # 饭后档  时段：12:00–12:30 / 17:30–18:00
      # ───────────────────────────────────────
      - AFTER_MEAL_TEMP=22
      - AFTER_MEAL_MODE=制冷
      - AFTER_MEAL_WIND=小

      # ───────────────────────────────────────
      # 日常档  时段：工作日在宿舍 + 周末全天（睡眠除外）
      # ───────────────────────────────────────
      - NORMAL_TEMP=24
      - NORMAL_MODE=制冷
      - NORMAL_WIND=小

      # ───────────────────────────────────────
      # 睡眠档  时段：23:00–次日 06:00
      # ───────────────────────────────────────
      - SLEEP_TEMP=25
      - SLEEP_MODE=制冷
      - SLEEP_WIND=小

      # ─────────────────────────────────────
      # 参数可选值
      # 温度：16–30（整数）
      # 模式：制冷(cool/0) 制热(heat/1) 自动(auto/2) 送风(fan/3) 除湿(dry/4)
      # 风速：自动(auto/0) 小(low/1) 中(medium/2) 大(高/3)
      # ─────────────────────────────────────

    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"